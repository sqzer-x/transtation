name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: version strings must match the tag being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME}"
          got=$(sed -n 's/^VERSION=${TT_VERSION:-\(v[0-9.]*\)}.*/\1/p' install.sh)
          echo "tag=$want  install.sh=$got"
          [ "$want" = "$got" ] || { echo "::error::install.sh pins $got but the tag is $want"; exit 1; }
          bad=$(grep -oE 'v1\.[0-9]+\.[0-9]+' install.sh README.md | grep -v ":$want$" || true)
          [ -z "$bad" ] || { echo "::error::stale version strings:"; echo "$bad"; exit 1; }

      # Builds both images for amd64 only and runs their offline self-checks.
      # Everything runs with --network none, so CI never registers a WARP
      # identity: hammering Cloudflare's registration endpoint from shared
      # runner IPs is how an entire address range gets rate-limited.
      - name: test
        run: sh test.sh

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - name: transtation
            dockerfile: server/Dockerfile
          - name: transtation-client
            dockerfile: client/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance and SBOM attestations are off: they add a manifest list
          # entry that some older clients choke on, and the compose file is
          # already pinned by digest, which closes the mutable-tag hole for
          # free. Turn them on when a downstream consumer asks for them.
          provenance: false
          sbom: false

      # The digest goes into install.sh at release time so that the compose file
      # pins the image by content, not by a mutable tag.
      - name: digest
        run: echo "${{ matrix.name }} -> ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # The README tells people to check install.sh against a hash in the release
      # notes, so the release notes have to exist and have to carry that hash.
      - name: publish the release notes with the installer hash
        if: matrix.name == 'transtation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum=$(sha256sum install.sh | cut -d" " -f1)
          {
            echo "\`\`\`"
            echo "$sum  install.sh"
            echo "\`\`\`"
            echo
            echo "    curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh"
            echo "    sha256sum install.sh    # must match the line above"
            echo "    less install.sh"
            echo "    sudo sh install.sh"
            echo
            echo "Images: \`ghcr.io/${{ github.repository_owner }}/transtation:${{ github.ref_name }}\` and \`…/transtation-client:${{ github.ref_name }}\` (amd64, arm64)."
            echo "The installer resolves the tag to a digest at install time and pins the compose file to it."
          } > notes.md
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md || \
            gh release edit "${{ github.ref_name }}" --notes-file notes.md
